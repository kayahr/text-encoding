name: ci
on: [push]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Build project
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Create API Doc
        run: npm run apidoc
      - name: Deploy API Doc
        if: github.ref == 'refs/heads/main'
        uses: kayahr/deploy-github-pages-action@v7
        with:
          path: lib/apidoc
